<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster Simulator</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1>Monster Simulator</h1></header>
<section class="meters" aria-label="Monster status">
<label>Happiness <strong id="happiness">75.00 / 100</strong><span class="meter-art happiness-art"><img class="meter-fill" src="assets/happiness_fill.png" alt=""><img class="meter-frame" src="assets/happiness_frame.png" alt=""></span><progress id="happy-bar" max="100" value="75"></progress></label>
<label>Stamina <strong id="stamina">100 / 100</strong><span class="meter-art stamina-art"><img class="meter-fill" src="assets/energy_fill.png" alt=""><img class="meter-frame" src="assets/energy_frame.png" alt=""></span><progress id="stamina-bar" max="100" value="100"></progress></label>
</section>
<section class="room"><span id="mood" class="mood">NORMAL</span><img id="pet" alt="Your animated monster" src="assets/idle_01.png"><p id="bubble" aria-live="polite">Hi! Want to play?</p></section>
<output id="ticks" hidden>0</output>
<section class="actions" aria-label="Care actions">
<button id="play" data-action="play"><img src="assets/play.png" alt=""><b>Play</b></button>
<button id="study" data-action="study"><img src="assets/study.png" alt=""><b>Study</b></button>
<button id="eat" data-action="eat"><img src="assets/feed.png" alt=""><b>Eat</b></button>
<button id="sleep" data-action="sleep"><img src="assets/sleep.png" alt=""><b>Sleep</b></button>
</section>
<p id="restriction">A little play, a little care.</p>
<details><summary>Recording presets</summary><p>These reset the starting values for recording boundary rules. Actions and decay still use the real game logic.</p><div class="demo"><button data-scenario="normal">New pet</button><button data-scenario="happy">Almost happy</button><button data-scenario="sad">A quiet mood</button><button data-scenario="tired">Nearly tired</button></div></details>

</main><script src="model.js"></script><script src="anchors.js"></script><script src="game.js"></script></body></html>
